<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000d18; width: 1200px; height: 900px; overflow: hidden; font-family: 'DM Sans', sans-serif; }

  .container {
    position: relative;
    width: 1200px;
    height: 900px;
  }

  /* Fotka medúzy - centrovaná, s rentgenovým efektem */
  .jellyfish-photo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%);
    height: 820px;
    width: auto;
    filter: 
      brightness(0.85)
      saturate(1.2)
      hue-rotate(15deg)
      drop-shadow(0 0 30px rgba(0, 160, 227, 0.3))
      drop-shadow(0 0 80px rgba(0, 100, 180, 0.15));
    mix-blend-mode: screen;
    opacity: 0.92;
  }

  /* Tmavý overlay pro blend */
  .dark-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(0,13,24,0.4) 70%, rgba(0,13,24,0.85) 100%);
    pointer-events: none;
  }

  /* SVG popisků přes celou plochu */
  .labels-svg {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 900px;
  }

  /* Název dole */
  .title {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  .title h2 {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .title p {
    font-size: 13px;
    color: #00A0E3;
    letter-spacing: 2px;
    font-style: italic;
    margin-top: 3px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

<script>
function applyLang(lang){
  document.querySelectorAll('[data-cs]').forEach(function(el){
    el.textContent = (lang==='en') ? (el.dataset.en || el.dataset.cs) : el.dataset.cs;
  });
}
window.addEventListener('message', function(ev){
  var d = ev.data || {};
  if(d.type === 'lang') applyLang(d.lang);
});
(function(){
  var q = new URLSearchParams(location.search).get('lang');
  if(q) applyLang(q);
})();
</script>
